# Verifiable Finding Admission Rule (Evaluated on Held-Out Validation Split Only)
# Rule:
#   1. val_positives >= 100
#   2. pos_mask_dice >= 0.50
#   3. unresolved_source_confound == false

rule:
  min_val_positives: 100
  min_pos_mask_dice: 0.50
  require_no_unresolved_source_confound: true
  evaluated_split: val
  checkpoint_id: convnext_tiny_fpn_chest16_512@sha256:18fe69565a47

